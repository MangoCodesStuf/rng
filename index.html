<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangoCodesStuf RNG</title>
  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: system-ui;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <p id="status">Finding a random repository...</p>

  <script>
    async function randomRepo() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          "https://api.github.com/users/MangoCodesStuf/repos?per_page=100&type=owner"
        );

        if (!response.ok) throw new Error("GitHub API unavailable");

        const repos = await response.json();

        if (!repos.length) throw new Error("No repositories found");

        const random = repos[
          Math.floor(Math.random() * repos.length)
        ];

        status.textContent = "Opening " + random.name + "...";

        window.location.replace(random.html_url);

      } catch (error) {
        status.textContent = "Couldn't load repositories. Try again.";
      }
    }

    randomRepo();
  </script>
</body>
</html>
